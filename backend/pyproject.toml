[project]
name = "talk-souravtripathy-backend"
version = "0.1.0"
description = "FastAPI + vLLM backend for talk.souravtripathy.com"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "vllm>=0.4.2",
    "motor>=3.4.0",
    "psutil>=5.9.0",
    "torch>=2.2.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.6.0",
]

[project.scripts]
# Start the server with: uv run serve
serve = "uvicorn main:app --host 0.0.0.0 --port 8000 --reload false"

[tool.uv]
# uv will create .venv inside the backend directory
# Run the app with:  uv run python main.py
# Install deps with: uv sync
